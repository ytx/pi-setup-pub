[defaults]
# inventory/: hosts/ (groups and hosts only), group_vars/, host_vars/.
# Secrets go in a directory of the same shape outside the repository; add it
# here when you have one (a missing one is only a warning):
#   inventory = inventory, ~/.config/pi-setup/secrets
# Giving -i replaces this list.
inventory = inventory
roles_path = roles
timeout = 60
# The Pis are reinstalled often, so their host keys change
host_key_checking = False
interpreter_python = auto_silent
