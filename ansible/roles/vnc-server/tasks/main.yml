---
# vnc-server: Enable/Disable VNC on Raspberry Pi OS (Wayland/X11)
#
# vnc_server_type:
#   - auto: let raspi-config decide (default)
#   - realvnc: force RealVNC (for X11, e.g., chromium-kiosk2)
#   - wayvnc: force wayvnc (for Wayland)

- name: Enable VNC server via raspi-config
  ansible.builtin.command: raspi-config nonint do_vnc 0
  changed_when: false
  when:
    - vnc_enabled | default(true)
    - vnc_server_type == "auto"

- name: Disable VNC server via raspi-config
  ansible.builtin.command: raspi-config nonint do_vnc 1
  changed_when: false
  when: not (vnc_enabled | default(true))

# RealVNC (for X11 environments)
- name: Disable wayvnc for RealVNC mode
  ansible.builtin.systemd:
    name: wayvnc
    enabled: false
    state: stopped
  when:
    - vnc_enabled | default(true)
    - vnc_server_type == "realvnc"
  ignore_errors: true

- name: Disable RealVNC tray icon for kiosk use
  ansible.builtin.lineinfile:
    path: /root/.vnc/config.d/vncserver-x11
    regexp: '^DisableTrayIcon='
    line: 'DisableTrayIcon=1'
    create: true
    owner: root
    group: root
    mode: '0600'
  when:
    - vnc_enabled | default(true)
    - vnc_server_type == "realvnc"

- name: Enable RealVNC service
  ansible.builtin.systemd:
    name: vncserver-x11-serviced
    enabled: true
    state: started
  when:
    - vnc_enabled | default(true)
    - vnc_server_type == "realvnc"

# wayvnc (for Wayland environments)
- name: Disable RealVNC for wayvnc mode
  ansible.builtin.systemd:
    name: vncserver-x11-serviced
    enabled: false
    state: stopped
  when:
    - vnc_enabled | default(true)
    - vnc_server_type == "wayvnc"
  ignore_errors: true

- name: Enable wayvnc service
  ansible.builtin.systemd:
    name: wayvnc
    enabled: true
    state: started
  when:
    - vnc_enabled | default(true)
    - vnc_server_type == "wayvnc"
