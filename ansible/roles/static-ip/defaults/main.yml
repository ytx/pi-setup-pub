---
# The interface whose address is fixed
network_interface: wlan0
# Set these for your network, usually once for all hosts in
# inventory/group_vars/all.yml. Required when static_ip is set.
gateway: ""
dns_servers: []
# With static_ip unset, a connection still on a manual address is put back
# on DHCP. Set false to leave hosts without static_ip alone entirely.
static_ip_revert: true
