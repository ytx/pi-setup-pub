---
name: lint

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the tools
        run: pip install -r requirements-dev.txt
      - name: Leak check (generic patterns only - the private list is not here)
        run: scripts/check-leaks.sh --all
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
